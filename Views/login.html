<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CraftBarber - Iniciar Sesion</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style-login.css">
</head>
<body>

    <button id="btn-home" class="mc-btn-home" title="Volver al Inicio">
        <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="#FFFFFF"/>
        </svg>
    </button>

    <main class="login-container">
        
        <div class="mc-panel animated-pop-in">
            <header class="role-selector">
                <h2 class="title-question">¿ERES?</h2>
                <div class="radio-group">
                    <label class="mc-radio">
                        <input type="radio" name="role" value="usuario" checked>
                        <span class="checkmark"></span>
                        USUARIO
                    </label>
                    <label class="mc-radio">
                        <input type="radio" name="role" value="barbero">
                        <span class="checkmark"></span>
                        BARBERO
                    </label>
                    <label class="mc-radio">
                        <input type="radio" name="role" value="dueno">
                        <span class="checkmark"></span>
                        DUEÑO
                    </label>
                </div>
            </header>

            <form id="login-form" class="login-form">
                <div class="input-group">
                    <label>NOMBRE DE USUARIO</label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="input-group">
                    <label>EMAIL</label>
                    <input type="email" id="email" required>
                </div>

                <div class="input-group">
                    <label>CONTRASEÑA</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" class="mc-btn-action">INICIAR SESION</button>
            </form>
        </div>

         <!-- Agregar div para mostrar errores -->
            <div id="error-message" style="color: #ff4444; margin-top: 15px; text-align: center; font-size: 12px; display: none;"></div>
        </div>

        <div class="mc-panel-bridge animated-pop-in">
            <h1 class="mc-title">¿ERES NUEVO?</h1>
            <p class="mc-subtitle">¡CREA UNA CUENTA PARA EMPEZAR!</p>
            <a href="register.html" class="mc-btn-link" id="link-to-register">REGISTRARSE</a>
        </div>

    </main>

    <script type="module" src="js/script-login.js"></script>
</body>
</html>
