<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CraftBarber - Iniciar Sesión</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="JS/main.js" defer></script>
</head>
<body>
    <header>
        <h1>Iniciar Sesion</h1>
        <nav>
            <a href="home.html">Inicio</a>
            <a href="login.html">Iniciar Sesión</a>
        </nav>
    </header>

    <main class="login-container">
        <form id="loginForm">
            <h2>Identificación de Usuario</h2>
            
            <label for="username">Usuario (Jugador):</label>
            <input type="text" id="username" placeholder="Ej: Laura_Craft" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>

            <label for="role">Selecciona tu Rol:</label>
            <select id="role">
                <option value="cliente">Cliente (Jugador)</option>
                <option value="barbero">Barbero (Admin)</option>
                <option value="vendedor">Gestor de Ventas</option>
            </select>

            <button type="submit">Entrar al Mundo</button>
        </form>
    </main>
</body>
</html>
