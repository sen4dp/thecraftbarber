<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CraftBarber - Iniciar Sesion</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style-login.css">
</head>
<body>

    <main class="login-container">
        
        <div class="mc-panel animated-pop-in">
            <header class="role-selector">
                <h2 class="title-question">¿ERES?</h2>
                <div class="radio-group">
                    <label class="mc-radio">
                        <input type="radio" name="role" value="usuario" checked>
                        <span class="checkmark"></span>
                        USUARIO
                    </label>
                    <label class="mc-radio">
                        <input type="radio" name="role" value="barbero">
                        <span class="checkmark"></span>
                        BARBERO
                    </label>
                    <label class="mc-radio">
                        <input type="radio" name="role" value="dueno">
                        <span class="checkmark"></span>
                        DUEÑO
                    </label>
                </div>
            </header>

            <form id="login-form" class="login-form">
                <div class="input-group">
                    <label>NOMBRE DE USUARIO</label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="input-group">
                    <label>EMAIL</label>
                    <input type="email" id="email" required>
                </div>

                <div class="input-group">
                    <label>CONTRASEÑA</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" class="mc-btn-action">INICIAR SESION</button>
            </form>
        </div>

    </main>

    <script src="js/script-login.js"></script>
</body>
</html>
