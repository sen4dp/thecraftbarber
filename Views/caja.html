<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Caja - The Craft Barber</title>
  <link rel="stylesheet" href="/Views/css/style-dbadmin.css">
</head>
<body>
  <div class="background-overlay"></div>
  <main class="cash-page">
    <a id="back-link" href="/Views/home.html" class="btn-text cash-back">← VOLVER</a>
    <section class="card cash-terminal">
      <h1 class="card-title">TERMINAL DE CAJA</h1>
      <p class="card-subtitle">Escribe el radicado de 5 caracteres para validar y cobrar en efectivo una cita o un pedido de la tienda.</p>
      <input id="cash-code" class="cash-code" maxlength="5" autocomplete="off" placeholder="X7R2K">
      <button id="lookup-btn" class="btn-primary cash-lookup">BUSCAR RADICADO</button>
      <div id="cash-result" class="cash-result"></div>
    </section>
  </main>
  <script type="module" src="/Views/js/script-caja.js"></script>
</body>
</html>
