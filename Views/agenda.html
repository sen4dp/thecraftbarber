<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Agenda - The Craft Barber</title><link rel="stylesheet" href="/Views/css/style-dbusuario.css"><style>
.agenda-page{max-width:1200px;margin:30px auto;padding:20px}.agenda-layout{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}.card{margin-bottom:20px}.barber-list,.time-list,.payment-list{display:grid;gap:10px}.barber-card,.time-slot,.payment-btn{padding:14px;border:1px solid #444;background:#171717;color:#fff;cursor:pointer;border-radius:8px;text-align:left}.selected{outline:2px solid #8bc34a;background:#243018}.portfolio{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.portfolio img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.agenda-status{margin-top:12px}.agenda-status.ok{color:#7dcc55}.agenda-status.error{color:#ff7777}.success-box{padding:18px;border:1px solid #7dcc55;border-radius:8px}.actions{display:flex;justify-content:flex-end;margin-top:15px}
@media(max-width:800px){.agenda-layout{grid-template-columns:1fr}.portfolio{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="agenda-page"><section class="hero-banner"><div class="hero-text"><p class="hero-eyebrow">THE CRAFT BARBER</p><h1 class="hero-title">RESERVA TU CITA</h1><p class="hero-date">ELIGE BARBERO, PORTAFOLIO, FECHA, HORA Y PAGO</p></div></section><div class="agenda-layout"><div><section class="card"><h2 class="card-title">1. BARBERO</h2><div id="barber-list" class="barber-list"><p class="empty-message">CARGANDO...</p></div><p id="selected-barber" class="agenda-subtitle">NINGUNO SELECCIONADO</p><div id="portfolio" class="portfolio"><p class="empty-message">SELECCIONA UN BARBERO.</p></div></section><section class="card"><h2 class="card-title">2. FECHA Y HORA</h2><input id="booking-date" type="date"><p id="barber-live-state" class="agenda-subtitle"></p><div id="time-list" class="time-list"><p class="empty-message">ELIGE FECHA.</p></div></section></div><div><section class="card"><h2 class="card-title">3. SERVICIO</h2><form id="booking-form"><input id="service" maxlength="80" placeholder="Ej. Corte + barba" required><input id="total" type="number" min="0" step="1000" placeholder="Valor total en COP" required><h2 class="card-title" style="margin-top:20px">4. MÉTODO DE PAGO</h2><div class="payment-list"><button type="button" class="payment-btn" data-payment="nequi">NEQUI</button><button type="button" class="payment-btn" data-payment="daviplata">DAVIPLATA</button><button type="button" class="payment-btn" data-payment="breb">BRE-B</button><button type="button" class="payment-btn" data-payment="efectivo">EFECTIVO</button></div><p id="payment-info" class="agenda-subtitle">Selecciona un método.</p><div class="actions"><button class="btn-primary" type="submit">CONFIRMAR RESERVA</button></div></form><p id="agenda-status" class="agenda-status"></p><div id="booking-summary"></div></section></div></div></main><script type="module" src="/Views/js/script-agenda.js"></script></body></html>
