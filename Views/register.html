<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CraftBarber - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Views/css/style-register.css">
</head>
<body>
    <button id="btn-home" class="mc-btn-home" title="Volver al Inicio">
        <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="#FFFFFF"/>
        </svg>
    </button>

    <main class="register-container">
        
        <div class="mc-panel animated-pop-in">
            <header class="role-selector">
                <h2 class="title-question">¿ERES?</h2>
                <div class="radio-group">
                    <label class="mc-radio">
                        <input type="radio" name="role" value="usuario" checked>
                        <span class="checkmark"></span>
                        USUARIO
                    </label>
                    <label class="mc-radio">
                        <input type="radio" name="role" value="barbero">
                        <span class="checkmark"></span>
                        BARBERO
                    </label>
                </div>
            </header>

            <form id="register-form" class="register-form">
                <div class="input-group">
                    <label>NOMBRE DE USUARIO</label>
                    <input type="text" id="reg-username" required>
                </div>
                
                <div class="input-group">
                    <label>EMAIL</label>
                    <input type="email" id="reg-email" required>
                </div>

                <div class="input-group">
                    <label>CONTRASEÑA</label>
                    <input type="password" id="reg-password" required>
                </div>

                <div class="input-group">
                    <label>REPETIR CONTRASEÑA</label>
                    <input type="password" id="reg-confirm-password" required>
                </div>

                <button type="submit" class="mc-btn-register">REGISTRARSE</button>
            </form>
        </div>

        <div class="mc-panel-bridge animated-pop-in">
            <h1 class="mc-title">¡BIENVENIDO A THE CRAFTBARBER!</h1>
            <p class="mc-subtitle">¿YA TIENES UNA CUENTA?</p>
            <a href="login.html" class="mc-btn-link" id="link-to-login">INICIAR SESIÓN</a>
        </div>

    </main>

    <script src="/Views/js/script-register.js"></script>
</body>
</html>
